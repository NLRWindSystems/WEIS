General:
    verbosity: False

DLC_driver:

    fix_wind_seeds: True
    fix_wave_seeds: True
    n_seeds: 1

    metocean_conditions:
        # Current speed bins (primary flow variable for MHK)
        current_speed: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
        # TI as fraction at each speed bin (no IEC turbulence class for TECs)
        current_TI_NTM: [0.12, 0.10, 0.09, 0.09, 0.08, 0.08, 0.08]
        current_TI_ETM: [0.15, 0.125, 0.1125, 0.1125, 0.10, 0.10, 0.10]
        # Normal sea state (OSS) wave conditions indexed by current speed
        wave_height_NSS: [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1]
        wave_period_NSS: [5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0]
        # Severe sea state wave conditions indexed by current speed
        wave_height_SSS: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0]
        wave_period_SSS: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
        # Extreme return-period values
        wave_height1: 2.0
        wave_period1: 8.0
        wave_height5: 2.8
        wave_period5: 9.5
        wave_height50: 4.5
        wave_period50: 12.0
        # MHK-specific metocean
        wave_height_cutout: 1.5
        current_peak_spring: 4.0
        current_mean_spring: 3.0

    DLCs:
        - DLC: "1.1"
        - DLC: "1.3"
        - DLC: "1.2"
        - DLC: "2.1"
          genfault_time: 100
        - DLC: "2.2"
          pitchfault_time1: 100
          pitchfault_blade1pos: 20
        - DLC: "3.1"
        - DLC: "3.2"
        - DLC: "4.1"
          analysis_time: 700
          normal_shutdown_time: 400
        - DLC: "4.2"
          normal_shutdown_time: 400
        - DLC: "5.1"
          n_seeds: 1
          n_azimuth: 1
          shutdown_time: 300
          transient_time: 0.0
        - DLC: "6.1"
        - DLC: "6.2"
        - DLC: "7.1"
        - DLC: "7.2"
        - DLC: "AEP"
